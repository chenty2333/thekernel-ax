name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      axtask_registry_ready:
        description: Run the real registry-only thekernel-axtask publish dry-run
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt
      - name: Formatting, registry graph, and provenance
        run: |
          cargo +nightly fmt --all -- --check
          python3 scripts/check_registry_dependencies.py
          scripts/check-provenance.sh

  axsched-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.76.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test unpacked axsched artifact at MSRV
        run: scripts/test-axsched-msrv.sh

  axcbpf-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test, lint, document, package, and cross-check axcbpf
        run: |
          cargo +1.85.0 test -p thekernel-axcbpf --all-targets --locked
          cargo +1.85.0 test -p thekernel-axcbpf --doc --locked
          cargo +1.85.0 clippy -p thekernel-axcbpf --all-targets --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +1.85.0 doc -p thekernel-axcbpf --no-deps --locked
          scripts/package-unpack-original.sh thekernel-axcbpf

  axfault-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test, lint, document, package, and cross-check axfault
        run: |
          cargo +1.85.0 test -p thekernel-axfault --all-targets --locked
          cargo +1.85.0 test -p thekernel-axfault --doc --locked
          cargo +1.85.0 clippy -p thekernel-axfault --all-targets --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +1.85.0 doc -p thekernel-axfault --no-deps --locked
          scripts/package-unpack-original.sh thekernel-axfault

  axtlb-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test, lint, document, package, and cross-check axtlb
        run: |
          cargo +1.85.0 test -p thekernel-axtlb --all-targets --locked
          cargo +1.85.0 test -p thekernel-axtlb --doc --locked
          cargo +1.85.0 clippy -p thekernel-axtlb --all-targets --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +1.85.0 doc -p thekernel-axtlb --no-deps --locked
          scripts/package-unpack-original.sh thekernel-axtlb

  axpmu-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test, lint, document, and cross-check source and packaged axpmu
        run: |
          cargo +1.85.0 test -p thekernel-axpmu --all-targets --locked
          cargo +1.85.0 test -p thekernel-axpmu --doc --locked
          cargo +1.85.0 clippy -p thekernel-axpmu --all-targets --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +1.85.0 doc -p thekernel-axpmu --no-deps --locked
          scripts/package-unpack-original.sh thekernel-axpmu

  axpoll-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test, lint, document, and cross-check axpoll
        run: |
          cargo +1.85.0 test -p thekernel-axpoll --all-targets --locked
          cargo +1.85.0 clippy -p thekernel-axpoll --all-targets --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +1.85.0 doc -p thekernel-axpoll --no-deps --locked

  axtask-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test axtask feature matrix
        run: |
          features='multitask irq preempt smp sched-cfs task-ext irq-continuation-diagnostics irq-exit'
          test_features='test multitask irq preempt smp sched-cfs task-ext irq-continuation-diagnostics irq-exit'
          cargo +nightly check -p thekernel-axtask --no-default-features --locked
          cargo +nightly test -p thekernel-axtask --all-targets --locked --features "$test_features"
          cargo +nightly clippy -p thekernel-axtask --all-targets --locked --features "$test_features" -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +nightly doc -p thekernel-axtask --no-deps --locked --features "$features"
          for scheduler in sched-fifo sched-rr sched-cfs; do
            cargo +nightly check -p thekernel-axtask --locked --features "multitask irq preempt smp task-ext $scheduler"
          done
      - name: Test publish and unpacked release artifacts
        env:
          AXCBPF_CARGO_TOOLCHAIN: 1.85.0
          CARGO_TOOLCHAIN: nightly
          AXTASK_REGISTRY_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.axtask_registry_ready && '1' || '0' }}
        run: |
          scripts/publish-dry-run.sh
          scripts/package-unpack.sh
